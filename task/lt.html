<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" type="text/css" href="style2.css">
    <script src="script2.js"></script>
</head>

<body>

    <div class="container">

        <h2>Student Registration Form</h2>

        <h3>Total Registration :
    <span id="totalRegistrations">0</span>
</h3>

        <form onsubmit="return registration();">

            <label>
                First Name <span class="required">*</span>
            </label><br>
            <input type="text" id="fname" name="fname">
            <p id="fnameError"></p>

            <label>
                Last Name <span class="required">*</span>
            </label><br>
            <input type="text" id="lname" name="lname">
            <p id="lnameError"></p>

            <label>
                Student ID <span class="required">*</span>
            </label><br>
            <input type="text" id="sid" name="sid">
            <p id="sidError"></p>

            <label>
                Email <span class="required">*</span>
            </label><br>
            <input type="text" id="email" name="email">
            <p id="emailError"></p>

            <label>
                Credit Completed <span class="required">*</span>
            </label><br>
            <input type="number" id="credit" name="credit">
            <p id="creditError"></p>

            <label>
                Department <span class="required">*</span>
            </label><br>

            <select id="department">
                <option value="">Select Department</option>
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="BBA">BBA</option>
                <option value="CS">CS</option>
            </select>

            <p id="departmentError"></p>

            <br>

            <div class="buttonDiv">
                <input type="submit" value="Register">
            </div>

        </form>

    </div>

    <br><br>

    <div class="container">

        <h2>Registered Student List</h2>

        <table border="1" width="100%" id="studentTable">

            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Student ID</th>
                <th>Email</th>
                <th>Credit</th>
                <th>Department</th>
            </tr>

        </table>

    </div>

</body>

</html>
