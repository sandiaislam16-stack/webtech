<html>
<head>
    <title>Pental Shop</title>
    <link rel="stylesheet" href="style1/style1.css">
</head>
 
<body>
 
    <div class="container">
 
        <h1>Welcome to Pental Shop</h1>
 
        <table>
            <tr>
                <th>Item Name</th>
                <th>Quantity</th>
                <th>Status</th>
            </tr>
 
            <tr>
                <td>Pencils</td>
                <td>100</td>
                <td>In Stock</td>
            </tr>
 
            <tr>
                <td>Notebooks</td>
                <td>50</td>
                <td>Low Stock</td>
            </tr>
 
            <tr>
                <td>Markers</td>
                <td>15</td>
                <td>In Stock</td>
            </tr>
        </table>
 
        <div class="contact-box">
 
            <h2>Contact Information</h2>
 
            <form>
 
                <label>Name</label>
                <input type="text">
 
                <label>Email</label>
                <input type="email">
 
                <label>Message</label>
                <textarea></textarea>
 
                <br><br>
 
                <button type="submit">Submit</button>
 
            </form>
 
        </div>
 
    </div>
 
</body>
</html>
